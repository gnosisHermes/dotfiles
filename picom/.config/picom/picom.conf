# los defaults del notas con amdgpu

backend = "glx";
vsync = true;
xrender-sync-fence = true;
use-damage = true;

unredir-if-possible = true;
dithered-present = false;

shadow = false;
shadow-radius = 8;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.40;
shadow-color = "#000000";
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 0.5;
inactive-opacity-override = false;
inactive-dim = 0.0;

blur-method = "none";
corner-radius = 0;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;

log-level = "warn";

shadow-exclude = [
  "window_type = 'utility' && class_g = 'firefox'",
];

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = true; };
  dnd = { shadow = false; };
  menu = { shadow = false; };
  popup_menu = { shadow = false; opacity = 1.0; };
  dropdown_menu = { shadow = false; opacity = 1.0; };
};
opacity-rule = [
    "10:class_g = 'xwinwrap'",
    "100:class_g = 'URxvt' && !_NET_WM_STATE@:32a",
];
