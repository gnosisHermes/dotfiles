[colors]
background = #000000
background-alt = #1a1a1a
foreground = #cccccc
primary = #8A038A
secondary = #00ffff
alert = #8A038A

disabled = #555555

[bar/example]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000
padding-left = 0
padding-right = 0
module-margin = 0

separator = |
separator-foreground = ${colors.disabled}

font-0 = Terminus (TTF);2

modules-left = xworkspaces 
modules-right = pulseaudio systray memory cpu eth cmus recording date

cursor-click = pointer
cursor-scroll = ns-resize
override-redirect = true
enable-ipc = true

[module/systray]
type = internal/tray

[module/cmus]
type = custom/script

exec = ~/.config/polybar/cmus.sh
exec-if = pgrep -x cmus
interval = 1

click-left = cmus-remote --pause
scroll-down = cmus-remote --next
scroll-up = cmus-remote --prev

label-maxlen = 100

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

; IMPORTANTE: Usar %icon% en lugar de %name% para que coja el mapa de abajo
label-active = %icon%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

; Aquí mapeas el nombre real que te da cwm (one, two...) al icono que quieres mostrar:
icon-0 = one;odin
icon-1 = two;dva
icon-2 = three;tri
icon-3 = four;chetyre
icon-4 = five;pyat
icon-5 = six;shest
icon-6 = seven;sem
icon-7 = eight;vosem
icon-8 = nine;devyat
icon-default = ♟


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}
max-volume = 100

[module/xkeyboard]

type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/network]

type = internal/network
interface = eth0
interface-type = wired
interval = 3.0

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#8A038A}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/recording]
type = custom/script
exec = [ -f /tmp/polybaricon ] && cat /tmp/polybaricon || echo ""
interval = 1
format = <label>
format-prefix = ""
label = %output%
; Opcional: si quieres que al hacer clic con el ratón pase algo (por ejemplo, parar la grabación)
click-left = kill -9 $(cat /tmp/recordingpid) && rm /tmp/recordingpid

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
