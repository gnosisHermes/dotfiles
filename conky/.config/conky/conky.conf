conky.config = {
   use_xft = true,
   xftalpha = 1,
   update_interval = 1.0,
   total_run_times = 0,
   own_window = true,
   own_window_transparent = false,
   own_window_argb_visual = true,
   own_window_type = 'normal',
   own_window_class = 'conky-semi',
   own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
   own_window_colour = '000',
   own_window_transparent = false,
   own_window_argb_visual = true,
   own_window_argb_value = 80,
   background = false,
   double_buffer = true,
   imlib_cache_size = 0,
   no_buffers = true,
   uppercase = false,
   cpu_avg_samples = 2,
   override_utf8_locale = true,
   
   -- placement
   alignment = 'top_right',
   gap_x = 10,
   gap_y = 40,
   
   -- default drawing
   draw_shades = false,
   draw_outline = false,
   draw_borders = false,
   draw_graph_borders = true,
   default_bar_width = 150, default_bar_height = 5,
   default_graph_width = 150, default_graph_height = 12,
   default_gauge_width = 20, default_gauge_height = 20,
   
   -- colors
   font = 'Terminus:size=12',
   default_color = 'green',
   color1 = 'white',
   color2 = 'green',
   color3 = 'purple',
   color4 = 'yellow',
   color5 = 'brown',
   color6 = 'black',
   
   -- layouting
   template0 = [[${font Terminus:bold:size=11}${color2}\1 ${color3}${hr 2}${font}]],
   template1 = [[${color1}\1]],
   template2 = [[${goto 100}${color2}]],
   template3 = [[${goto 180}${color}${alignr}]],
   template4 = [[${goto 180}${color4}${alignr}]],
   template5 = [[${goto 180}${color5}${alignr}]],
   template5 = [[${goto 180}${color6}${alignr}]],
   template6 = [[${goto 180}${color3}${alignr}]],
};

conky.text = [[
${template0 Info}
${template1 Date}                                                           ${template3}${color3}${time %a,}${color}${time %e %B %G}
${template1 Time}                                                           ${template3}${time %T}
 
${template0 System}
${template1 Hostname}                                                       ${template3}${nodename}
${template1 ${sysname}}                                                     ${template3}${kernel}-${machine}
${template1 Uptime}                                                         ${template3}${uptime_short}
${template1 CPU}                                                            ${template3}${freq_g}GHz

 
${template0 Processors}
${template1 Load}               ${template2}${loadavg 1}                    ${template6}${loadgraph}
${template1 Core\ 1}            ${template2}${cpu cpu1}%                    ${template3}${cpubar cpu1}
${template1 Core\ 2}            ${template2}${cpu cpu2}%                    ${template4}${cpubar cpu2}
${template1 Core\ 3}            ${template2}${cpu cpu3}%                    ${template3}${cpubar cpu3}
${template1 Core\ 4}            ${template2}${cpu cpu4}%                    ${template4}${cpubar cpu4}
${template1 Top}                ${template2}${top name 1}                   ${template5}${top cpu 1}
 
${template0 Memory}
${template1 Memory}             ${template2}${memperc}% used                ${template3}${mem} / ${memmax}
                                                                            ${template3}${membar}
${template1 Swap}               ${template2}${swapperc}% used               ${template3}${swap} / ${swapmax}
                                                                            ${template3}${swapbar}
${template0 Filesystem}
${template1 /}                  ${template2}${fs_free /} free               ${template3}${fs_used /} / ${fs_size /}
${template3}${fs_bar /}
${template1 IO\ Read}           ${template2}${diskio_read}                  ${template3}${diskiograph_read}
${template1 IO\ Write}          ${template2}$diskio_write                   ${template3}$diskiograph_write
${template1 Top}                ${template2}${top_io name 1}                ${template3}${top_io io_perc 1}%
 
${template0 Networking}

${if_existing /proc/net/route eth0}\
${template1 Ip}                                                             ${template3}${addr eth0}
${template1 Download}           ${template2}${downspeed eth0}               ${template3}${downspeedgraph eth0}
${template1 Upload}             ${template2}${upspeed eth0}                 ${template3}${upspeedgraph eth0}
${template1 Total Down/Up}                                                  ${template3}${totaldown eth0}↓ / ${totalup eth0}↑
${endif}\
${template1 Clima}${template2}${execi 3600 curl -s "wttr.in/Collado%20Villalba?format=+%t+"}

]];
